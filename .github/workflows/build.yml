# 새 글을 올리면 홈페이지를 다시 만들어 배포한다.
#
# data/ 를 고쳐 저장하면(GitHub 웹에서 Commit changes) 이 작업이 돌아
# 바뀐 HTML 을 같은 브랜치에 되올린다. GitHub Pages 가 그것을 그대로 낸다.
#
# 되올리는 커밋은 *.html 과 sitemap.xml 만 건드리는데, 아래 paths 에 그
# 경로들이 없으므로 작업이 스스로를 다시 부르지 않는다.
name: 홈페이지 다시 만들기

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/**'
      - 'assets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:        # Actions 탭에서 손으로 돌릴 수도 있다

permissions:
  contents: write

concurrency:                # 연달아 올려도 마지막 것만 살아남는다
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필요한 것 설치
        run: pip install --quiet pillow

      - name: 새 글 파일 형식 검사
        run: python3 tools/check_curated.py

      - name: 홈페이지 다시 만들기
        run: python3 tools/build_site.py

      - name: 링크·자산 확인
        run: |
          python3 - <<'PY'
          import os, re, glob, urllib.parse, sys
          pages = {os.path.normpath(p) for p in glob.glob('**/*.html', recursive=True)
                   if not p.startswith(('data/', 'tools/'))}
          bad = miss = 0
          for p in pages:
              s = open(p, encoding='utf-8').read()
              for x in re.findall(r'href="([^"#?:]+\.html)"', s):
                  t = os.path.normpath(os.path.join(os.path.dirname(p), urllib.parse.unquote(x)))
                  if not os.path.exists(t):
                      bad += 1; print(f'깨진 링크: {p} → {x}')
              for x in re.findall(r'(?:src|href)="((?:\.\./)*assets/[^"]+)"', s):
                  t = os.path.normpath(os.path.join(os.path.dirname(p), urllib.parse.unquote(x)))
                  if not os.path.exists(t):
                      miss += 1; print(f'없는 자산: {p} → {x}')
          print(f'페이지 {len(pages)} · 깨진 링크 {bad} · 없는 자산 {miss}')
          sys.exit(1 if (bad or miss) else 0)
          PY

      - name: 바뀐 것 되올리기
        run: |
          git config user.name  "tjpi-site-bot"
          git config user.email "tjpi-site-bot@users.noreply.github.com"
          git add -A ':!data' ':!tools' ':!.github'
          if git diff --cached --quiet; then
            echo "바뀐 페이지가 없습니다."
            exit 0
          fi
          git commit -m "홈페이지 다시 만듦 (자동) [skip ci]"
          git push
