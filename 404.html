<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>페이지를 찾을 수 없습니다 — POSTECH 박태준미래전략연구소</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  .nf{min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--on-dark);text-align:center;padding:40px 24px}
  .nf .code{font-family:var(--serif);font-size:clamp(64px,12vw,140px);line-height:1;color:var(--gold);letter-spacing:-.05em}
  .nf h1{font-family:var(--serif);font-size:clamp(20px,3vw,30px);margin:24px 0 12px;color:#fff}
  .nf p{color:var(--on-dark-2);font-size:15px;line-height:1.9}
  .nf p.en{font-size:13px;margin-top:6px;font-style:italic}
  .nf .acts{display:flex;gap:12px;justify-content:center;margin-top:36px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="nf">
  <div>
    <p class="code">404</p>
    <h1>요청하신 페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 삭제된 페이지일 수 있습니다.</p>
    <p class="en">The page you are looking for could not be found.</p>
    <div class="acts">
      <a class="btn btn-p" href="/">메인으로</a>
      <a class="btn btn-g" href="/en/">English</a>
    </div>
  </div>
</main>
</body>
</html>
